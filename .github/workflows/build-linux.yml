name: Build AppImage (test)

on:
  workflow_dispatch:

jobs:
  linux:
    name: AppImage
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        run: |
          source .github/read_versions.sh
          echo "MOKU_VERSION=$MOKU_VERSION" >> "$GITHUB_ENV"
          echo "TSUNAGU_VERSION=$TSUNAGU_VERSION" >> "$GITHUB_ENV"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libfuse2 fuse desktop-file-utils \
            librsvg2-bin librsvg2-common libgtk-3-bin libgdk-pixbuf2.0-bin \
            gsettings-desktop-schemas adwaita-icon-theme \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-gnu }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Stage Tsunagu backend
        env:
          GH_TOKEN: ${{ secrets.TSUNAGU_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "v${TSUNAGU_VERSION}" --repo moku-project/Tsunagu \
            --pattern 'tsunagu-linux-amd64' \
            --pattern 'sandbox.jar' \
            --pattern 'runtime-linux-amd64.tar.gz' \
            --pattern 'sha256sums.txt' \
            --dir tsunagu-dl --clobber
          cd tsunagu-dl
          for f in tsunagu-linux-amd64 sandbox.jar runtime-linux-amd64.tar.gz; do
            grep " $f\$" sha256sums.txt | sha256sum -c -
          done
          cd ..
          mkdir -p src-tauri/resources/sandbox
          install -Dm755 tsunagu-dl/tsunagu-linux-amd64 src-tauri/resources/tsunagu
          install -Dm644 tsunagu-dl/sandbox.jar         src-tauri/resources/sandbox/sandbox.jar
          tar -xzf tsunagu-dl/runtime-linux-amd64.tar.gz -C src-tauri/resources/sandbox/
          chmod +x src-tauri/resources/sandbox/runtime/bin/java
          test -f src-tauri/resources/sandbox/runtime/lib/modules
          src-tauri/resources/sandbox/runtime/bin/java -version

      - name: Build
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --config src-tauri/tauri.linux.conf.json --verbose

      - name: Inject bundled JRE into AppImage
        run: |
          set -euo pipefail
          B=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage
          APPIMAGE=$(find "$B" -name '*.AppImage' | head -1)
          [ -n "$APPIMAGE" ] || { echo "no AppImage produced"; exit 1; }
          NAME=$(basename "$APPIMAGE")

          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool

          cd "$B"
          rm -rf squashfs-root
          "./$NAME" --appimage-extract >/dev/null

          RT=squashfs-root/usr/lib/Moku/sandbox/runtime
          rm -rf "$RT"
          mkdir -p "$(dirname "$RT")"
          cp -r "$GITHUB_WORKSPACE/src-tauri/resources/sandbox/runtime" "$RT"
          chmod +x "$RT/bin/java"
          test -f "$RT/lib/modules"
          "$RT/bin/java" -version

          rm -f "$NAME"
          ARCH=x86_64 /tmp/appimagetool --no-appstream squashfs-root "$NAME"
          rm -rf squashfs-root

          test -f "$NAME"
          chmod +x "$NAME"
          "./$NAME" --appimage-extract 'usr/lib/Moku/sandbox/runtime/bin/java' >/dev/null
          test -x squashfs-root/usr/lib/Moku/sandbox/runtime/bin/java
          rm -rf squashfs-root

      - name: Collect artifacts
        run: |
          set -euo pipefail
          V="${MOKU_VERSION}"
          B=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          mkdir -p out
          APPIMAGE=$(find "$B/appimage" -name '*.AppImage' | head -1 || true)
          DEB=$(find "$B/deb" -name '*.deb' | head -1 || true)
          [ -n "$APPIMAGE" ] && cp "$APPIMAGE" "out/Moku-$V-x86_64.AppImage"
          [ -n "$DEB" ]      && cp "$DEB"      "out/moku_${V}_amd64.deb"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: moku-linux
          path: out/*
          if-no-files-found: error

