name: Build Linux (test)

on:
  workflow_dispatch:

jobs:
  linux:
    name: AppImage + deb
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        run: |
          source .github/read_versions.sh
          echo "MOKU_VERSION=$MOKU_VERSION" >> "$GITHUB_ENV"
          echo "TSUNAGU_VERSION=$TSUNAGU_VERSION" >> "$GITHUB_ENV"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libfuse2 fuse desktop-file-utils \
            librsvg2-bin librsvg2-common libgtk-3-bin libgdk-pixbuf2.0-bin \
            gsettings-desktop-schemas adwaita-icon-theme \
            libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-gnu }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Stage Tsunagu backend
        env:
          GH_TOKEN: ${{ secrets.TSUNAGU_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "v${TSUNAGU_VERSION}" --repo moku-project/Tsunagu \
            --pattern 'tsunagu-linux-amd64' \
            --pattern 'sandbox.jar' \
            --pattern 'runtime-linux-amd64.tar.gz' \
            --pattern 'sha256sums.txt' \
            --dir tsunagu-dl --clobber
          cd tsunagu-dl
          for f in tsunagu-linux-amd64 sandbox.jar runtime-linux-amd64.tar.gz; do
            grep " $f\$" sha256sums.txt | sha256sum -c -
          done
          cd ..
          mkdir -p src-tauri/resources/sandbox
          install -Dm755 tsunagu-dl/tsunagu-linux-amd64 src-tauri/resources/tsunagu
          install -Dm644 tsunagu-dl/sandbox.jar         src-tauri/resources/sandbox/sandbox.jar
          tar -xzf tsunagu-dl/runtime-linux-amd64.tar.gz -C src-tauri/resources/sandbox/
          chmod +x src-tauri/resources/sandbox/runtime/bin/java
          test -f src-tauri/resources/sandbox/runtime/lib/modules
          src-tauri/resources/sandbox/runtime/bin/java -version

      - name: Build
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --config src-tauri/tauri.linux.conf.json --verbose

      - name: Collect artifacts
        run: |
          set -euo pipefail
          V="${MOKU_VERSION}"
          B=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          mkdir -p out
          APPIMAGE=$(find "$B/appimage" -name '*.AppImage' | head -1 || true)
          DEB=$(find "$B/deb" -name '*.deb' | head -1 || true)
          [ -n "$APPIMAGE" ] && cp "$APPIMAGE" "out/Moku-$V-x86_64.AppImage"
          [ -n "$DEB" ]      && cp "$DEB"      "out/moku_${V}_amd64.deb"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: moku-linux
          path: out/*
          if-no-files-found: error

  flatpak:
    name: Flatpak
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        run: |
          source .github/read_versions.sh
          echo "MOKU_VERSION=$MOKU_VERSION" >> "$GITHUB_ENV"
          echo "TSUNAGU_VERSION=$TSUNAGU_VERSION" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:static

      - name: Generate cargo-sources.json
        run: |
          python3 -m pip install --quiet aiohttp PyYAML tomlkit
          python3 packaging/flatpak-cargo-generator.py src-tauri/Cargo.lock -o cargo-sources.json

      - name: Stage Tsunagu backend
        env:
          GH_TOKEN: ${{ secrets.TSUNAGU_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "v${TSUNAGU_VERSION}" --repo moku-project/Tsunagu \
            --pattern 'tsunagu-linux-amd64' \
            --pattern 'sandbox.jar' \
            --pattern 'runtime-linux-amd64.tar.gz' \
            --pattern 'sha256sums.txt' \
            --dir tsunagu-dl --clobber
          cd tsunagu-dl
          for f in tsunagu-linux-amd64 sandbox.jar runtime-linux-amd64.tar.gz; do
            grep " $f\$" sha256sums.txt | sha256sum -c -
          done
          cd ..
          mkdir -p tsunagu
          cp tsunagu-dl/tsunagu-linux-amd64 tsunagu/tsunagu-linux-amd64
          cp tsunagu-dl/sandbox.jar         tsunagu/sandbox.jar
          tar -xzf tsunagu-dl/runtime-linux-amd64.tar.gz -C tsunagu/
          test -f tsunagu/runtime/lib/modules

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//48 org.gnome.Sdk//48 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08 \
            org.freedesktop.Platform.ffmpeg-full//24.08

      - name: Build flatpak
        run: |
          rm -rf build-dir repo
          flatpak-builder --verbose --user --disable-rofiles-fuse --install-deps-from=flathub \
            --repo=repo --force-clean build-dir io.github.MokuProject.Moku.yml

      - name: Bundle
        run: |
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo moku.flatpak io.github.MokuProject.Moku
          mkdir -p out && cp moku.flatpak "out/Moku-${MOKU_VERSION}.flatpak"

      - uses: actions/upload-artifact@v4
        with:
          name: moku-flatpak
          path: out/*
          if-no-files-found: error
