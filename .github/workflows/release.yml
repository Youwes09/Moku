name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Moku version to release (no leading v), e.g. 0.10.5"
        required: true
      tsunagu_version:
        description: "Tsunagu backend version to bundle (no leading v). Blank keeps the current pin in nix/versions.nix"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    name: Bump, tag, draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Bump version in all the places
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          T="${{ inputs.tsunagu_version }}"
          sed -i "s/moku = \"[^\"]*\"/moku = \"$V\"/"             nix/versions.nix
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/"  src-tauri/tauri.conf.json
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"$V\"/"   src-tauri/Cargo.toml
          if [ -n "$T" ]; then
            sed -i "s/tsunagu = \"[^\"]*\"/tsunagu = \"$T\"/"      nix/versions.nix
          fi
          (cd src-tauri && cargo generate-lockfile)

      - name: Commit, tag, push
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "release: v$V" || echo "already at v$V, nothing to commit"
          git tag -f "v$V"
          git push origin HEAD:main
          git push -f origin "v$V"

      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ inputs.version }}"
          gh release view "v$V" >/dev/null 2>&1 && { echo "release v$V already exists"; exit 0; }
          gh release create "v$V" --draft --title "Moku v$V" --generate-notes

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Read versions
        shell: bash
        run: |
          source .github/read_versions.sh
          echo "TSUNAGU_VERSION=$TSUNAGU_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Stage Tsunagu backend
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TSUNAGU_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "v${TSUNAGU_VERSION}" --repo moku-project/Tsunagu \
            --pattern 'tsunagu-windows-amd64.exe' \
            --pattern 'sandbox.jar' \
            --pattern 'runtime-windows-amd64.zip' \
            --pattern 'sha256sums.txt' \
            --dir tsunagu-dl --clobber
          cd tsunagu-dl
          for f in tsunagu-windows-amd64.exe sandbox.jar runtime-windows-amd64.zip; do
            grep " $f\$" sha256sums.txt | sha256sum -c -
          done
          cd ..
          mkdir -p src-tauri/resources/sandbox
          cp tsunagu-dl/tsunagu-windows-amd64.exe src-tauri/resources/tsunagu.exe
          cp tsunagu-dl/sandbox.jar               src-tauri/resources/sandbox/sandbox.jar
          unzip -q tsunagu-dl/runtime-windows-amd64.zip -d src-tauri/resources/sandbox/
          test -f src-tauri/resources/tsunagu.exe
          test -f src-tauri/resources/sandbox/sandbox.jar
          test -f src-tauri/resources/sandbox/runtime/bin/java.exe
          test -f src-tauri/resources/sandbox/runtime/lib/modules
          src-tauri/resources/sandbox/runtime/bin/java.exe -version

      - name: Build
        run: pnpm tauri build --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          EXE=$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name "*-setup.exe" | head -1)
          [ -n "$EXE" ] || { echo "no installer found"; exit 1; }
          cp "$EXE" "Moku_${V}_x64-setup.exe"
          gh release upload "v$V" "Moku_${V}_x64-setup.exe" --clobber

  macos:
    name: macOS (arm64 + x64)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Read versions
        run: |
          source .github/read_versions.sh
          echo "TSUNAGU_VERSION=$TSUNAGU_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download Tsunagu backend (arm64 + x64)
        env:
          GH_TOKEN: ${{ secrets.TSUNAGU_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "v${TSUNAGU_VERSION}" --repo moku-project/Tsunagu \
            --pattern 'tsunagu-darwin-*' \
            --pattern 'sandbox.jar' \
            --pattern 'runtime-darwin-*.tar.gz' \
            --pattern 'sha256sums.txt' \
            --dir tsunagu-dl --clobber
          cd tsunagu-dl
          for f in tsunagu-darwin-arm64 tsunagu-darwin-amd64 sandbox.jar \
                   runtime-darwin-arm64.tar.gz runtime-darwin-amd64.tar.gz; do
            grep " $f\$" sha256sums.txt | shasum -a 256 -c -
          done

      - name: Stage Tsunagu resources per arch
        run: |
          set -euo pipefail
          stage() {
            local bin="$1" runtime="$2" dest="$3"
            rm -rf "$dest"
            mkdir -p "$dest/sandbox"
            cp "tsunagu-dl/$bin" "$dest/tsunagu"
            chmod +x "$dest/tsunagu"
            cp tsunagu-dl/sandbox.jar "$dest/sandbox/sandbox.jar"
            tar -xzf "tsunagu-dl/$runtime" -C "$dest/sandbox/"
            chmod +x "$dest/sandbox/runtime/bin/java"
            test -x "$dest/tsunagu"
            test -f "$dest/sandbox/sandbox.jar"
            test -x "$dest/sandbox/runtime/bin/java"
            test -f "$dest/sandbox/runtime/lib/modules"
            "$dest/sandbox/runtime/bin/java" -version
          }
          stage tsunagu-darwin-arm64  runtime-darwin-arm64.tar.gz  resources-aarch64-apple-darwin
          stage tsunagu-darwin-amd64  runtime-darwin-amd64.tar.gz  resources-x86_64-apple-darwin

      - name: Build (aarch64)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: |
          set -euo pipefail
          rm -rf src-tauri/resources
          cp -r resources-aarch64-apple-darwin src-tauri/resources
          pnpm tauri build --target aarch64-apple-darwin --config src-tauri/tauri.macos.conf.json

      - name: Build (x86_64)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: |
          set -euo pipefail
          rm -rf src-tauri/resources
          cp -r resources-x86_64-apple-darwin src-tauri/resources
          pnpm tauri build --target x86_64-apple-darwin --config src-tauri/tauri.macos.conf.json

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          ARM64=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          X64=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          [ -n "$ARM64" ] && cp "$ARM64" "moku-macos-arm64-$V.dmg" && gh release upload "v$V" "moku-macos-arm64-$V.dmg" --clobber
          [ -n "$X64" ]   && cp "$X64"   "moku-macos-x64-$V.dmg"   && gh release upload "v$V" "moku-macos-x64-$V.dmg" --clobber

  flatpak:
    name: Flatpak
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Read versions
        run: |
          source .github/read_versions.sh
          echo "TSUNAGU_VERSION=$TSUNAGU_VERSION" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:static

      - name: Generate cargo-sources.json
        run: |
          python3 -m pip install --quiet aiohttp PyYAML tomlkit
          python3 packaging/flatpak-cargo-generator.py src-tauri/Cargo.lock -o cargo-sources.json

      - name: Stage Tsunagu backend
        env:
          GH_TOKEN: ${{ secrets.TSUNAGU_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "v${TSUNAGU_VERSION}" --repo moku-project/Tsunagu \
            --pattern 'tsunagu-linux-amd64' \
            --pattern 'sandbox.jar' \
            --pattern 'runtime-linux-amd64.tar.gz' \
            --pattern 'sha256sums.txt' \
            --dir tsunagu-dl --clobber
          cd tsunagu-dl
          for f in tsunagu-linux-amd64 sandbox.jar runtime-linux-amd64.tar.gz; do
            grep " $f\$" sha256sums.txt | sha256sum -c -
          done
          cd ..
          mkdir -p tsunagu
          cp tsunagu-dl/tsunagu-linux-amd64 tsunagu/tsunagu-linux-amd64
          cp tsunagu-dl/sandbox.jar         tsunagu/sandbox.jar
          tar -xzf tsunagu-dl/runtime-linux-amd64.tar.gz -C tsunagu/
          test -f tsunagu/runtime/lib/modules

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.flatpak.Builder \
            org.gnome.Platform//48 org.gnome.Sdk//48 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08 \
            org.freedesktop.Platform.ffmpeg-full//24.08

      - name: Build flatpak
        run: |
          rm -rf build-dir repo
          dbus-run-session -- flatpak run org.flatpak.Builder --verbose --user \
            --disable-rofiles-fuse \
            --repo=repo --force-clean build-dir io.github.MokuProject.Moku.yml

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo "Moku-${V}.flatpak" io.github.MokuProject.Moku
          gh release upload "v$V" "Moku-${V}.flatpak" --clobber

  linux:
    name: Linux AppImage
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Read versions
        run: |
          source .github/read_versions.sh
          echo "TSUNAGU_VERSION=$TSUNAGU_VERSION" >> "$GITHUB_ENV"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libfuse2 fuse desktop-file-utils \
            librsvg2-bin librsvg2-common libgtk-3-bin libgdk-pixbuf2.0-bin \
            gsettings-desktop-schemas adwaita-icon-theme \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-gnu }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Stage Tsunagu backend
        env:
          GH_TOKEN: ${{ secrets.TSUNAGU_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "v${TSUNAGU_VERSION}" --repo moku-project/Tsunagu \
            --pattern 'tsunagu-linux-amd64' \
            --pattern 'sandbox.jar' \
            --pattern 'runtime-linux-amd64.tar.gz' \
            --pattern 'sha256sums.txt' \
            --dir tsunagu-dl --clobber
          cd tsunagu-dl
          for f in tsunagu-linux-amd64 sandbox.jar runtime-linux-amd64.tar.gz; do
            grep " $f\$" sha256sums.txt | sha256sum -c -
          done
          cd ..
          mkdir -p src-tauri/resources/sandbox
          install -Dm755 tsunagu-dl/tsunagu-linux-amd64 src-tauri/resources/tsunagu
          install -Dm644 tsunagu-dl/sandbox.jar         src-tauri/resources/sandbox/sandbox.jar
          tar -xzf tsunagu-dl/runtime-linux-amd64.tar.gz -C src-tauri/resources/sandbox/
          chmod +x src-tauri/resources/sandbox/runtime/bin/java
          test -f src-tauri/resources/sandbox/runtime/lib/modules
          src-tauri/resources/sandbox/runtime/bin/java -version

      - name: Build
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --config src-tauri/tauri.linux.conf.json --verbose

      - name: Inject bundled JRE into AppImage
        run: |
          set -euo pipefail
          B=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage
          APPIMAGE=$(find "$B" -name '*.AppImage' | head -1)
          [ -n "$APPIMAGE" ] || { echo "no AppImage produced"; exit 1; }
          NAME=$(basename "$APPIMAGE")

          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool

          cd "$B"
          rm -rf squashfs-root
          "./$NAME" --appimage-extract >/dev/null

          RT=squashfs-root/usr/lib/Moku/sandbox/runtime
          rm -rf "$RT"
          mkdir -p "$(dirname "$RT")"
          cp -r "$GITHUB_WORKSPACE/src-tauri/resources/sandbox/runtime" "$RT"
          chmod +x "$RT/bin/java"
          test -f "$RT/lib/modules"
          "$RT/bin/java" -version

          rm -f "$NAME"
          ARCH=x86_64 /tmp/appimagetool --no-appstream squashfs-root "$NAME"
          rm -rf squashfs-root

          test -f "$NAME"
          chmod +x "$NAME"
          "./$NAME" --appimage-extract 'usr/lib/Moku/sandbox/runtime/bin/java' >/dev/null
          test -x squashfs-root/usr/lib/Moku/sandbox/runtime/bin/java
          rm -rf squashfs-root

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          B=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage
          APPIMAGE=$(find "$B" -name '*.AppImage' | head -1)
          [ -n "$APPIMAGE" ] || { echo "no AppImage produced"; exit 1; }
          cp "$APPIMAGE" "Moku-${V}-x86_64.AppImage"
          gh release upload "v$V" "Moku-${V}-x86_64.AppImage" --clobber
